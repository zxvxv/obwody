blueprint:
  name: "Obwody Krytyczne (Smart Recovery) v1.12"
  description: >
    System ochrony zasilania z INTELIGENTNYM POWROTEM oparty na fizycznym przekaźniku inwertera.
    
    HISTORIA WERSJI:
    v1.12 - REWOLUCJA LOGIKI: Usunięto warunki napięciowe. Przejście na twardy odczyt stanu przekaźnika AC inwertera (binary_sensor.deye_inverter_ac_grid_relay).
            Wprowadzono tryb 'restart' (ochrona przed migotaniem sieci). Uproszczono wywołania celów (wsparcie dla Urządzeń i Obszarów).

    0. ZANIK NAPIĘCIA (Przekaźnik OFF przez 5s) -> Wyłącza GRUPĘ 0 (Natychmiastowa).
    1. AWARIA SIECI (Przekaźnik OFF przez 10s) -> Wyłącza GRUPĘ 1 (Największe odbiorniki).
    2. SŁABA BATERIA (< Limit 1) -> Wyłącza GRUPĘ 2 (Ostrzegawcze).
    3. PUSTA BATERIA (< Limit 2) -> Wyłącza GRUPĘ 3 (Reszta domu).
    
    POWRÓT ZASILANIA (Sekwencja Startu):
    Wymaga przekaźnika ON przez 30s.
    Najpierw GRUPA 3 (Najważniejsze) -> potem GRUPA 2 -> potem GRUPA 1 -> na końcu GRUPA 0.
  domain: automation
  input:
    # --- CZUJNIKI ---
    battery_soc:
      name: "Sensor Baterii (SOC)"
      default: sensor.deye_inverter_battery_bms_soc
      selector:
        entity:
          domain: sensor

    # --- PROGI ---
    soc_limit_1:
      name: "Próg Baterii - OSTRZEGAWCZY (%)"
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider

    soc_limit_2:
      name: "Próg Baterii - KRYTYCZNY (%)"
      default: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider

    # --- OBWODY ---
    targets_immediate:
      name: "GRUPA 0: Natychmiastowa / Hard Stop"
      description: "Te urządzenia gasną po 5s od rozłączenia sieci."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    targets_group_1:
      name: "GRUPA 1: Awaria Sieci (po 10s)"
      description: "Te urządzenia gasną po 10s od rozłączenia sieci."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    targets_group_2:
      name: "GRUPA 2: Słaba Bateria"
      description: "Te urządzenia gasną przy pierwszym progu (np. 80%)."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    targets_group_3:
      name: "GRUPA 3: Pusta Bateria / Full Shutdown"
      description: "Te urządzenia gasną OSTATNIE, a wstają PIERWSZE (Kluczowe systemy)."
      default: {}
      selector:
        target:
          entity:
            domain: switch

trigger:
  # Zimny Start i Ręczne uruchomienie
  - platform: homeassistant
    event: start
    id: cold_start
  - platform: event
    event_type: automation_reloaded
    id: cold_start

  # Wyzwalacze GRUPY 0 i 1 - Sztywny czas 5s i 10s na fizycznym przekaźniku
  - platform: state
    entity_id: binary_sensor.deye_inverter_ac_grid_relay
    to: "off"
    for: "00:00:05"
    id: grid_fail_fast
    
  - platform: state
    entity_id: binary_sensor.deye_inverter_ac_grid_relay
    to: "off"
    for: "00:00:10"
    id: grid_fail
  
  # Triggery spadku SOC działają natychmiastowo
  - platform: numeric_state
    entity_id: !input battery_soc
    below: !input soc_limit_1
    id: soc_1
  - platform: numeric_state
    entity_id: !input battery_soc
    below: !input soc_limit_2
    id: soc_2

  # Triggery powrotu SOC (OFF-GRID) z twardą histerezą +3%
  - platform: numeric_state
    entity_id: !input battery_soc
    above: !input soc_limit_1
    value_template: "{{ float(state.state, 0) - 3 }}"
    id: soc_ok_1
  - platform: numeric_state
    entity_id: !input battery_soc
    above: !input soc_limit_2
    value_template: "{{ float(state.state, 0) - 3 }}"
    id: soc_ok_2
  
  # Powrót Sieci - Wymaga 30s stabilizacji przekaźnika
  - platform: state
    entity_id: binary_sensor.deye_inverter_ac_grid_relay
    to: "on"
    for: "00:00:30"
    id: grid_ok

action:
  - choose:
      # Akcja dla ZIMNEGO STARTU
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: cold_start
              - condition: template
                value_template: "{{ trigger is not defined or trigger.id is not defined }}"
        sequence:
          # --- SPRAWDZENIE AWARII SIECI PRZY STARCIE ---
          - if:
              - condition: state
                entity_id: binary_sensor.deye_inverter_ac_grid_relay
                state: "off"
            then:
              - action: persistent_notification.create
                data:
                  title: "⚡ AWARIA (Zimny Start)"
                  message: "Uruchomiono system w trakcie awarii zasilania! Odcinam Grupy 0 i 1."
              - action: switch.turn_off
                target: !input targets_immediate
              - action: switch.turn_off
                target: !input targets_group_1

          # --- ZIMNY START: BATERIA KRYTYCZNA ---
          - if:
              - condition: numeric_state
                entity_id: !input battery_soc
                below: !input soc_limit_2
              - condition: state
                entity_id: binary_sensor.deye_inverter_ac_grid_relay
                state: "off"
            then:
              - action: persistent_notification.create
                data:
                  title: "🪫 BATERIA KRYTYCZNA (Zimny Start)"
                  message: "Krytyczny poziom baterii i brak sieci przy starcie! Odcinam Grupę 3."
              - action: switch.turn_off
                target: !input targets_group_3

          # --- ZIMNY START: BATERIA RATUNKOWA (WŁĄCZANIE OFF-GRID) ---
          - if:
              - condition: numeric_state
                entity_id: !input battery_soc
                above: !input soc_limit_2
                value_template: "{{ float(state.state, 0) - 3 }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "☀️ OFF-GRID POWRÓT (Zimny Start)"
                  message: "Magazyn naładowany po restarcie (+3% histerezy). Przywracam Grupę 3."
              - action: switch.turn_on
                target: !input targets_group_3

          # --- ZIMNY START: BATERIA OSTRZEGAWCZA ---
          - if:
              - condition: numeric_state
                entity_id: !input battery_soc
                below: !input soc_limit_1
              - condition: state
                entity_id: binary_sensor.deye_inverter_ac_grid_relay
                state: "off"
            then:
              - action: persistent_notification.create
                data:
                  title: "🔋 BATERIA SŁABA (Zimny Start)"
                  message: "Niski poziom baterii i brak sieci przy starcie! Odcinam Grupę 2."
              - action: switch.turn_off
                target: !input targets_group_2

          # --- ZIMNY START: BATERIA ŚREDNIA (WŁĄCZANIE OFF-GRID) ---
          - if:
              - condition: numeric_state
                entity_id: !input battery_soc
                above: !input soc_limit_1
                value_template: "{{ float(state.state, 0) - 3 }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "☀️ OFF-GRID POWRÓT (Zimny Start)"
                  message: "Magazyn naładowany po restarcie (+3% histerezy). Przywracam Grupę 2."
              - action: switch.turn_on
                target: !input targets_group_2

      # Akcja dla GRUPY 0 (Po 5s)
      - conditions:
          - condition: trigger
            id: grid_fail_fast
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚡ ZANIK NAPIĘCIA"
              message: "Rozłączenie przekaźnika sieci (>5s)! Wyłączam Grupę 0."
          - action: switch.turn_off
            target: !input targets_immediate

      # Akcja dla GRUPY 1 (Po 10s)
      - conditions:
          - condition: trigger
            id: grid_fail
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚡ AWARIA"
              message: "Brak zasilania AC (>10s)! Wyłączam Grupę 1 (Duże AGD)."
          - action: switch.turn_off
            target: !input targets_group_1
            
      # Akcja dla GRUPY 2 (Słaba bateria)
      - conditions:
          - condition: trigger
            id: soc_1
          - condition: state
            entity_id: binary_sensor.deye_inverter_ac_grid_relay
            state: "off"
        sequence:
          - action: persistent_notification.create
            data:
              title: "🔋 BATERIA SŁABA"
              message: "Wyłączam Grupę 2."
          - action: switch.turn_off
            target: !input targets_group_2
            
      # Akcja dla GRUPY 3 (Bateria krytyczna)
      - conditions:
          - condition: trigger
            id: soc_2
          - condition: state
            entity_id: binary_sensor.deye_inverter_ac_grid_relay
            state: "off"
        sequence:
          - action: persistent_notification.create
            data:
              title: "🪫 BATERIA KRYTYCZNA"
              message: "Wyłączam Grupę 3 (Total Shutdown)."
          - action: switch.turn_off
            target: !input targets_group_3

      # OFF-GRID POWRÓT DLA GRUPY 3 (Krytyczna + 3%)
      - conditions:
          - condition: trigger
            id: soc_ok_2
        sequence:
          - action: persistent_notification.create
            data:
              title: "☀️ OFF-GRID POWRÓT (Grupa 3)"
              message: "Magazyn naładowany (+3% histerezy). Przywracam zasilanie dla Grupy 3."
          - action: switch.turn_on
            target: !input targets_group_3

      # OFF-GRID POWRÓT DLA GRUPY 2 (Ostrzegawcza + 3%)
      - conditions:
          - condition: trigger
            id: soc_ok_1
        sequence:
          - action: persistent_notification.create
            data:
              title: "☀️ OFF-GRID POWRÓT (Grupa 2)"
              message: "Magazyn naładowany (+3% histerezy). Przywracam zasilanie dla Grupy 2."
          - action: switch.turn_on
            target: !input targets_group_2
            
      # POWRÓT ZASILANIA Z SIECI (GRID OK)
      - conditions:
          - condition: trigger
            id: grid_ok
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ POWRÓT ZASILANIA"
              message: "Przekaźnik sieciowy ustabilizowany (>30s). Przywracam zasilanie kaskadowo."
          
          # 1. Najpierw najważniejsze (Grupa 3)
          - delay: "00:00:05"
          - action: switch.turn_on
            target: !input targets_group_3
          
          # 2. Średnie (Grupa 2)
          - delay: "00:00:05"
          - action: switch.turn_on
            target: !input targets_group_2
          
          # 3. Obciążenia (Grupa 1)
          - delay: "00:00:05"
          - action: switch.turn_on
            target: !input targets_group_1
          
          # 4. Natychmiastowe na samym końcu (Grupa 0)
          - delay: "00:00:05"
          - action: switch.turn_on
            target: !input targets_immediate

mode: restart
