blueprint:
  name: "Obwody Krytyczne (Smart Recovery) v1.07"
  description: >
    System ochrony zasilania z INTELIGENTNYM POWROTEM.
    
    HISTORIA WERSJI:
    v1.07 - ZIMNY START / RESTART: Dodano odporność na restart HA w trakcie trwającej awarii oraz obsługę ręcznego wyzwolenia. 
            Skrypt natychmiast diagnozuje stan sieci oraz baterii przy starcie i w razie awarii bezwarunkowo odcina zasilanie grup, nie czekając na "przecięcie" progu.
    v1.06 - NAPRAWA IMPORTU HA: Usunięto błąd walidacji YAML. Zastąpiono szablony z '!input' natywnymi warunkami 'numeric_state'.
            Dodano 'mode: queued', aby wyeliminować wyścigi (Race Condition) bez blokowania importu z GitHuba.
            Przywrócono pełną logikę AND dla powrotu zasilania przy użyciu bezpiecznych bloków warunkowych.
    v1.05 - KRYTYCZNA POPRAWKA: Logika EEPROM uwzględnia teraz stany "unavailable" i "unknown", zapobiegając blokadzie ratunkowej.
            KRYTYCZNA POPRAWKA: Puste grupy (brak urządzeń) zwracają FALSE, co eliminuje błędy wywołania pustych usług w HA.
    v1.04 - OCHRONA EEPROM: Dodano warunki weryfikujące stan przed wysłaniem komendy zapisu. 
    v1.03 - Poprawka błędu 'Missing input': dodano parametr 'default: {}' dla GRUPY 0.
    v1.02 - Dodano GRUPĘ 0 (Natychmiastową).
    v1.01 - Dodano 5-sekundową zwłokę przy wykrywaniu awarii (Anty-Flicker).

    0. ZANIK NAPIĘCIA (< Limit V przez 1s) -> Wyłącza GRUPĘ 0 (Natychmiastowa).
    1. AWARIA SIECI (< Limit V przez 5s) -> Wyłącza GRUPĘ 1 (Największe odbiorniki).
    2. SŁABA BATERIA (< Limit 1) -> Wyłącza GRUPĘ 2 (Ostrzegawcze).
    3. PUSTA BATERIA (< Limit 2) -> Wyłącza GRUPĘ 3 (Reszta domu).
    
    POWRÓT ZASILANIA (Sekwencja Startu):
    Najpierw GRUPA 3 (Najważniejsze) -> potem GRUPA 2 -> potem GRUPA 1 -> na końcu GRUPA 0.
  domain: automation
  source_url: https://github.com/zxvxv/obwody/blob/main/blueprint.yaml
  input:
    # --- CZUJNIKI ---
    grid_voltage_l1:
      name: "Sensor Napięcia L1"
      default: sensor.deye_inverter_grid_l1_voltage
      selector:
        entity:
          domain: sensor
          device_class: voltage
    grid_voltage_l2:
      name: "Sensor Napięcia L2"
      default: sensor.deye_inverter_grid_l2_voltage
      selector:
        entity:
          domain: sensor
          device_class: voltage
    grid_voltage_l3:
      name: "Sensor Napięcia L3"
      default: sensor.deye_inverter_grid_l3_voltage
      selector:
        entity:
          domain: sensor
          device_class: voltage
    battery_soc:
      name: "Sensor Baterii (SOC)"
      default: sensor.deye_inverter_battery_bms_soc
      selector:
        entity:
          domain: sensor

    # --- PROGI ---
    voltage_limit:
      name: "Próg Napięcia - AWARIA (V)"
      default: 190
      selector:
        number:
          min: 150
          max: 230
          unit_of_measurement: V
          mode: box
    
    soc_limit_1:
      name: "Próg Baterii - OSTRZEGAWCZY (%)"
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider

    soc_limit_2:
      name: "Próg Baterii - KRYTYCZNY (%)"
      default: 20
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: slider

    # --- OBWODY ---
    targets_immediate:
      name: "GRUPA 0: Natychmiastowa / Hard Stop"
      description: "Te urządzenia gasną po 1s gdy tylko napięcie spadnie poniżej limitu."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    targets_group_1:
      name: "GRUPA 1: Awaria Sieci (po 5s)"
      description: "Te urządzenia gasną PIERWSZE przy awarii (po 5s), a wstają jako jedne z ostatnich (Duże AGD)."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    targets_group_2:
      name: "GRUPA 2: Słaba Bateria"
      description: "Te urządzenia gasną przy pierwszym progu (np. 80%)."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    targets_group_3:
      name: "GRUPA 3: Pusta Bateria / Full Shutdown"
      description: "Te urządzenia gasną OSTATNIE, a wstają PIERWSZE (Kluczowe systemy)."
      default: {}
      selector:
        target:
          entity:
            domain: switch

    # --- POWRÓT ---
    voltage_recovery:
      name: "Próg Napięcia - POWRÓT (V)"
      default: 215
      selector:
        number:
          min: 190
          max: 250
          unit_of_measurement: V
          mode: box

trigger:
  # Zimny Start i Ręczne uruchomienie
  - platform: homeassistant
    event: start
    id: cold_start
  - platform: event
    event_type: automation_reloaded
    id: cold_start

  # Wyzwalacze GRUPY 0 (v1.06) - 1 sekunda (odsiewanie błędów Modbus)
  - platform: numeric_state
    entity_id: !input grid_voltage_l1
    below: !input voltage_limit
    for: "00:00:01"
    id: grid_fail_fast
  - platform: numeric_state
    entity_id: !input grid_voltage_l2
    below: !input voltage_limit
    for: "00:00:01"
    id: grid_fail_fast
  - platform: numeric_state
    entity_id: !input grid_voltage_l3
    below: !input voltage_limit
    for: "00:00:01"
    id: grid_fail_fast

  # Wyzwalacze GRUPY 1 - Awaria min. 5 sekund
  - platform: numeric_state
    entity_id: !input grid_voltage_l1
    below: !input voltage_limit
    for: "00:00:05"
    id: grid_fail
  - platform: numeric_state
    entity_id: !input grid_voltage_l2
    below: !input voltage_limit
    for: "00:00:05"
    id: grid_fail
  - platform: numeric_state
    entity_id: !input grid_voltage_l3
    below: !input voltage_limit
    for: "00:00:05"
    id: grid_fail
  
  # Trigger SOC działa natychmiastowo
  - platform: numeric_state
    entity_id: !input battery_soc
    below: !input soc_limit_1
    id: soc_1
  - platform: numeric_state
    entity_id: !input battery_soc
    below: !input soc_limit_2
    id: soc_2
  
  # Powrót - Wymaga 30s stabilizacji (logika AND wszystkich faz sprawdzana w akcji)
  - platform: numeric_state
    entity_id: !input grid_voltage_l1
    above: !input voltage_recovery
    for: "00:00:30"
    id: grid_ok
  - platform: numeric_state
    entity_id: !input grid_voltage_l2
    above: !input voltage_recovery
    for: "00:00:30"
    id: grid_ok
  - platform: numeric_state
    entity_id: !input grid_voltage_l3
    above: !input voltage_recovery
    for: "00:00:30"
    id: grid_ok

action:
  # Deklaracja zmiennych z !input (bezpieczna metoda dla HA)
  - variables:
      t_0: !input targets_immediate
      t_1: !input targets_group_1
      t_2: !input targets_group_2
      t_3: !input targets_group_3

  - choose:
      # Akcja dla ZIMNEGO STARTU (Restart HA lub ręczne wywołanie)
      - conditions:
          - condition: template
            value_template: "{{ trigger is not defined or trigger.id == 'cold_start' }}"
        sequence:
          # --- SPRAWDZENIE AWARII SIECI PRZY STARCIE ---
          - if:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: !input grid_voltage_l1
                    below: !input voltage_limit
                  - condition: numeric_state
                    entity_id: !input grid_voltage_l2
                    below: !input voltage_limit
                  - condition: numeric_state
                    entity_id: !input grid_voltage_l3
                    below: !input voltage_limit
            then:
              - action: persistent_notification.create
                data:
                  title: "⚡ AWARIA (Zimny Start)"
                  message: "Uruchomiono system w trakcie awarii zasilania! Odcinam Grupy 0 i 1."
              - if:
                  - condition: template
                    value_template: >
                      {% set e = t_0.entity_id | default([]) %}
                      {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
                then:
                  - action: switch.turn_off
                    target: !input targets_immediate
              - if:
                  - condition: template
                    value_template: >
                      {% set e = t_1.entity_id | default([]) %}
                      {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
                then:
                  - action: switch.turn_off
                    target: !input targets_group_1

          # --- SPRAWDZENIE BATERII (OSTRZEGAWCZY) PRZY STARCIE ---
          - if:
              - condition: numeric_state
                entity_id: !input battery_soc
                below: !input soc_limit_1
            then:
              - if:
                  - condition: template
                    value_template: >
                      {% set e = t_2.entity_id | default([]) %}
                      {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
                then:
                  - action: persistent_notification.create
                    data:
                      title: "🔋 BATERIA SŁABA (Zimny Start)"
                      message: "Niski poziom baterii przy starcie! Odcinam Grupę 2."
                  - action: switch.turn_off
                    target: !input targets_group_2

          # --- SPRAWDZENIE BATERII (KRYTYCZNY) PRZY STARCIE ---
          - if:
              - condition: numeric_state
                entity_id: !input battery_soc
                below: !input soc_limit_2
            then:
              - if:
                  - condition: template
                    value_template: >
                      {% set e = t_3.entity_id | default([]) %}
                      {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
                then:
                  - action: persistent_notification.create
                    data:
                      title: "🪫 BATERIA KRYTYCZNA (Zimny Start)"
                      message: "Krytyczny poziom baterii przy starcie! Odcinam Grupę 3."
                  - action: switch.turn_off
                    target: !input targets_group_3

      # Akcja dla GRUPY 0 (Po 1s)
      - conditions:
          - condition: trigger
            id: grid_fail_fast
        sequence:
          - if:
              - condition: template
                value_template: >
                  {% set e = t_0.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: persistent_notification.create
                data:
                  title: "⚡ ZANIK NAPIĘCIA"
                  message: "Napięcie spadło (poniżej limitu przez 1s)! Wyłączam Grupę 0."
              - action: switch.turn_off
                target: !input targets_immediate

      # Akcja dla GRUPY 1 (Po 5s)
      - conditions:
          - condition: trigger
            id: grid_fail
        sequence:
          - if:
              - condition: template
                value_template: >
                  {% set e = t_1.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: persistent_notification.create
                data:
                  title: "⚡ AWARIA"
                  message: "Napięcie poniżej limitu przez >5s! Wyłączam Grupę 1 (Duże AGD)."
              - action: switch.turn_off
                target: !input targets_group_1
            
      # Akcja dla GRUPY 2 (Słaba bateria)
      - conditions:
          - condition: trigger
            id: soc_1
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: !input grid_voltage_l1
                below: !input voltage_limit
              - condition: numeric_state
                entity_id: !input grid_voltage_l2
                below: !input voltage_limit
              - condition: numeric_state
                entity_id: !input grid_voltage_l3
                below: !input voltage_limit
        sequence:
          - if:
              - condition: template
                value_template: >
                  {% set e = t_2.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: persistent_notification.create
                data:
                  title: "🔋 BATERIA SŁABA"
                  message: "Wyłączam Grupę 2."
              - action: switch.turn_off
                target: !input targets_group_2
            
      # Akcja dla GRUPY 3 (Bateria krytyczna)
      - conditions:
          - condition: trigger
            id: soc_2
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: !input grid_voltage_l1
                below: !input voltage_limit
              - condition: numeric_state
                entity_id: !input grid_voltage_l2
                below: !input voltage_limit
              - condition: numeric_state
                entity_id: !input grid_voltage_l3
                below: !input voltage_limit
        sequence:
          - if:
              - condition: template
                value_template: >
                  {% set e = t_3.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: persistent_notification.create
                data:
                  title: "🪫 BATERIA KRYTYCZNA"
                  message: "Wyłączam Grupę 3 (Total Shutdown)."
              - action: switch.turn_off
                target: !input targets_group_3
            
      # POWRÓT ZASILANIA
      - conditions:
          - condition: trigger
            id: grid_ok
          # Twarda weryfikacja logiki AND - wszystkie 3 fazy muszą być powyżej progu powrotu
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: !input grid_voltage_l1
                above: !input voltage_recovery
              - condition: numeric_state
                entity_id: !input grid_voltage_l2
                above: !input voltage_recovery
              - condition: numeric_state
                entity_id: !input grid_voltage_l3
                above: !input voltage_recovery
        sequence:
          # Ochrona przed powiadomieniem-widmo: sprawdź, czy jakakolwiek encja z grup faktycznie jest wyłączona lub niedostępna
          - condition: template
            value_template: >
              {% set ns = namespace(all_e=[]) %}
              {% for t in [t_0, t_1, t_2, t_3] %}
                {% set e = t.entity_id | default([]) %}
                {% if e is string %}{% set e = [e] %}{% endif %}
                {% set ns.all_e = ns.all_e + e %}
              {% endfor %}
              {{ expand(ns.all_e) | selectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list | length > 0 if ns.all_e else false }}
          
          - action: persistent_notification.create
            data:
              title: "✅ POWRÓT ZASILANIA"
              message: "Wszystkie fazy stabilne >30s. Przywracam zasilanie kaskadowo."
          
          # 1. Najpierw najważniejsze (Grupa 3)
          - delay: "00:00:05"
          - if:
              - condition: template
                value_template: >
                  {% set e = t_3.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: switch.turn_on
                target: !input targets_group_3
          
          # 2. Średnie (Grupa 2)
          - delay: "00:00:05"
          - if:
              - condition: template
                value_template: >
                  {% set e = t_2.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: switch.turn_on
                target: !input targets_group_2
          
          # 3. Obciążenia (Grupa 1)
          - delay: "00:00:05"
          - if:
              - condition: template
                value_template: >
                  {% set e = t_1.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: switch.turn_on
                target: !input targets_group_1
          
          # 4. Natychmiastowe na samym końcu (Grupa 0)
          - delay: "00:00:05"
          - if:
              - condition: template
                value_template: >
                  {% set e = t_0.entity_id | default([]) %}
                  {{ expand(e) | selectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list | length > 0 if e else false }}
            then:
              - action: switch.turn_on
                target: !input targets_immediate

mode: queued
max: 10
